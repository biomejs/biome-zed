authors        = ["biomejs <biomejs.dev>"]
description    = "Biome support for Zed"
id             = "biome"
name           = "Biome"
repository     = "https://github.com/biomejs/biome-zed"
schema_version = 1
version        = "0.3.2"

[language_servers.biome]
language = "JavaScript"
languages = [
  "JavaScript",
  "Google Apps Script",
  "JSX",
  "TypeScript",
  "TSX",
  "Vue.js",
  "Astro",
  "Svelte",
  "JSON",
  "JSONC",
  "CSS",
  "GraphQL",
  "HTML",
  "Markdown",
  "SCSS",
  "SVG",
  "XML",
  "YAML",
]
name = "Biome Language Server"

[language_servers.biome.language_ids]
"Astro"              = "astro"
"CSS"                = "css"
"Google Apps Script" = "javascript"
"GraphQL"            = "graphql"
"HTML"               = "html"
"JSON"               = "json"
"JSONC"              = "jsonc"
"JSX"                = "javascriptreact"
"JavaScript"         = "javascript"
"Markdown"           = "markdown"
"SCSS"               = "scss"
"SVG"                = "svg"
"Svelte"             = "svelte"
"TSX"                = "typescriptreact"
"TypeScript"         = "typescript"
"Vue.js"             = "vuejs"
"XML"                = "xml"
"YAML"               = "yaml"

[grammars.gritql]
repository = "https://github.com/honeycombio/tree-sitter-gritql"
rev        = "3a48815250680e85a44b3ab2fd74031ef3c66b7d"
